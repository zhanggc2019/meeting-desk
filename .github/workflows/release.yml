name: Publish signed Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/runtime/python
            src-tauri/.runtime-cache
          key: bundled-python-${{ runner.os }}-${{ hashFiles('src-tauri/python/requirements-local-asr.txt', 'scripts/prepare-python-runtime.ps1') }}

      - name: Prepare bundled Python runtime
        run: pnpm runtime:prepare

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Run release checks
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:python
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 听见纪要 v__VERSION__
          releaseBody: |
            - 新增本地 FSMN-VAD 模型支持，长录音会切成最长 30 秒的语音段后再转写，避免整段推理耗尽内存和分页文件。
            - 设置与帮助页面说明两个模型的放置位置；选择 SenseVoiceSmall 后会自动查找同级 fsmn-vad，“检查环境”会同时验证并加载两个模型。
            - 继续内置本地 FunASR Python 运行时；模型文件由用户单独下载后放置或选择，不包含在安装包和升级包中。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
