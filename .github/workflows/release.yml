name: Publish signed Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/runtime/python
            src-tauri/.runtime-cache
          key: bundled-python-${{ runner.os }}-${{ hashFiles('src-tauri/python/requirements-local-asr.txt', 'scripts/prepare-python-runtime.ps1') }}

      - name: Prepare bundled Python runtime
        run: pnpm runtime:prepare

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Run release checks
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:python
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 听见纪要 v__VERSION__
          releaseBody: |
            - 录音列表和详情页支持应用内直接试听，不再调用 Windows 默认播放器。
            - 导出可自由组合摘要、逐字稿和 AI 纪要，并保存为 Word 或 PDF 文档。
            - 逐字稿在组合文档中自动从新页开始，优化长文档阅读体验。
            - 旧记录找不到原始媒体时仍可重新关联文件，不额外复制或保存用户录音。
            - 模型文件仍由用户单独下载，不包含在安装包和升级包中。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Replace API asset URL in updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $installerName = "MeetingDesk_${version}_x64-setup.exe"
          $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$installerName"
          $manifestPath = Join-Path $env:RUNNER_TEMP "latest.json"

          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern latest.json --output $manifestPath
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json

          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $platform.Value.url = $installerUrl
          }

          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath -Encoding utf8
          gh release upload $tag $manifestPath --repo $env:GITHUB_REPOSITORY --clobber

          $publishedManifestUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/latest.json"
          $publishedManifest = Invoke-RestMethod -TimeoutSec 60 $publishedManifestUrl
          if ($publishedManifest.version -ne $version) {
            throw "Published updater manifest version is $($publishedManifest.version), expected $version"
          }

          foreach ($platform in $publishedManifest.platforms.PSObject.Properties) {
            if ($platform.Value.url -ne $installerUrl -or [string]::IsNullOrWhiteSpace($platform.Value.signature)) {
              throw "Published updater manifest has an invalid $($platform.Name) entry"
            }
          }

          $response = Invoke-WebRequest -UseBasicParsing -Method Head -TimeoutSec 60 $installerUrl
          if ($response.StatusCode -ne 200) {
            throw "Updater installer URL returned HTTP $($response.StatusCode): $installerUrl"
          }
