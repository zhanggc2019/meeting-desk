name: Publish signed Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/runtime/python
            src-tauri/.runtime-cache
          key: bundled-python-${{ runner.os }}-${{ hashFiles('src-tauri/python/requirements-local-asr.txt', 'scripts/prepare-python-runtime.ps1') }}

      - name: Prepare bundled Python runtime
        run: pnpm runtime:prepare

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Run release checks
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:python
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 听见纪要 v__VERSION__
          releaseBody: |
            - 大模型“测试连接”现在会发送不含用户数据的极简提示词，真实验证 API Key、所选模型和纪要接口。
            - 本地 ASR 设置新增 SenseVoiceSmall 与 FSMN-VAD 的 ModelScope 下载来源、PowerShell 命令、放置目录和一键复制。
            - 任务队列与会议记录新增分页；成功任务和会议记录均可二次确认删除，并级联清理关联逐字稿、纪要和任务数据。
            - 修复部分大模型返回 Markdown 代码围栏或简短说明时触发 invalid_minutes_json 的问题，同时继续拒绝多个或无效 JSON 候选。
            - 模型文件仍由用户单独下载，不包含在安装包和升级包中。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
