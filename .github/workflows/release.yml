name: Publish signed Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/runtime/python
            src-tauri/.runtime-cache
          key: bundled-python-${{ runner.os }}-${{ hashFiles('src-tauri/python/requirements-local-asr.txt', 'scripts/prepare-python-runtime.ps1') }}

      - name: Prepare bundled Python runtime
        run: pnpm runtime:prepare

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Run release checks
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:python
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 听见纪要 v__VERSION__
          releaseBody: |
            - 本地 FunASR 启用句级时间戳，保留真实 VAD 分段和每段起止时间，逐字稿结构更准确。
            - 历史逐字稿会按标点自动排成可读段落，不改变复制得到的原始全文。
            - 大模型请求默认超时提升至 180 秒；超时会显示具体阶段和处理建议，并允许直接重试任务。
            - 任务详情的失败提示新增“重试任务”入口，减少恢复中断任务的操作步骤。
            - 文件导入区域改为紧凑横向布局，降低界面空间占用。
            - 模型文件仍由用户单独下载，不包含在安装包和升级包中。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
